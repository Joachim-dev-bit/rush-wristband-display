
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rush Wristband Display</title>
<style>
:root {
  --bg: #050505;
  --panel: #171717;
  --ink: #ffffff;
  --muted: #b8b8b8;
  --line: rgba(255,255,255,.16);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--ink);
}
body { min-height: 100vh; }
#app {
  min-height: 100vh;
  padding: clamp(12px, 2vw, 28px);
  display: flex;
  flex-direction: column;
  gap: 18px;
  background-color: #050505;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.brand {
  font-size: clamp(24px, 3vw, 42px);
  font-weight: 900;
  letter-spacing: .04em;
}
.pill {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 14px;
  color: var(--muted);
  font-weight: 700;
  font-size: 13px;
}
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
}
.heading { text-align: center; }
.heading h1 {
  margin: 0 0 8px;
  font-size: clamp(26px, 3.2vw, 46px);
  font-weight: 900;
}
.heading p { margin: 0; color: var(--muted); }
.time-panel {
  align-self: center;
  background: rgba(0,0,0,.88);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 24px;
  text-align: center;
  min-width: 230px;
}
.time-label {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .15em;
  font-weight: 700;
}
.clock {
  font-size: clamp(26px, 3vw, 42px);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.colors {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.swatch {
  display: grid;
  grid-template-columns: minmax(100px, 1fr) minmax(95px, .6fr) minmax(110px, .7fr);
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-radius: 8px;
  background: #000;
  border: 1px solid rgba(255,255,255,.14);
  min-height: 55px;
}
.swatch.active {
  outline: 2px solid #fff;
  outline-offset: -2px;
  background: #101010;
}
.color-name { font-weight: 900; font-size: clamp(15px, 1.5vw, 21px); }
.color-time, .countdown {
  text-align: right;
  font-weight: 800;
  font-size: clamp(14px, 1.4vw, 19px);
  font-variant-numeric: tabular-nums;
}
.countdown { color: #f4d35e; }
.finished { color: #ff6961; }
.legend {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 12px;
}
.dot {
  display: inline-block;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  margin-right: 4px;
}
footer { text-align: center; color: var(--muted); font-size: 12px; }
#settingsButton {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 10;
  background: #222;
  color: white;
  border: 1px solid #666;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  cursor: pointer;
}
#settings {
  display: none;
  position: fixed;
  z-index: 11;
  right: 12px;
  bottom: 62px;
  width: min(320px, calc(100vw - 24px));
  padding: 16px;
  border: 1px solid #555;
  border-radius: 12px;
  background: #171717;
  box-shadow: 0 8px 30px #000;
}
#settings label { display: block; margin: 10px 0 5px; color: #ddd; }
#settings input, #settings select {
  width: 100%;
  padding: 8px;
  background: #080808;
  color: white;
  border: 1px solid #555;
  border-radius: 6px;
}
#settings button {
  margin-top: 12px;
  padding: 9px 12px;
  background: #0877e8;
  border: 0;
  border-radius: 6px;
  color: white;
  font-weight: 700;
  cursor: pointer;
}
@media(max-width: 600px) {
  .swatch { grid-template-columns: 1fr 1fr; gap: 5px 10px; }
  .color-time { text-align: left; }
  .countdown { grid-column: 1 / -1; text-align: left; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">RUSH <span style="color:#0877e8">WRISTBANDS</span></div>
    <div class="pill" id="dayLabel">DAGENS ARMBÅND</div>
  </header>

  <main>
    <div class="heading">
      <h1>DAGENS ARMBÅND</h1>
      <p>Følg tidene for dagens armbåndsfarger</p>
    </div>

    <div class="time-panel">
      <div class="time-label">NÅVÆRENDE TID</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>

    <section class="colors" id="colors"></section>
    <div class="legend">
      <span><span class="dot" style="background:#ff4fb8"></span>Pink</span>
      <span><span class="dot" style="background:#ed3030"></span>Red</span>
      <span><span class="dot" style="background:#c0c0c0"></span>Silver</span>
      <span><span class="dot" style="background:#22b95c"></span>Green</span>
      <span><span class="dot" style="background:#ff8c20"></span>Orange</span>
      <span><span class="dot" style="background:#1688ff"></span>Blue</span>
      <span><span class="dot" style="background:#ffe333"></span>Yellow</span>
      <span><span class="dot" style="background:#a64dff"></span>Purple</span>
      <span><span class="dot" style="background:#222;border:1px solid #777"></span>Black</span>
      <span><span class="dot" style="background:#fff"></span>White</span>
    </div>
  </main>
  <footer>Rush Trampolinepark · Tidene følger lokal norsk tid</footer>
</div>

<button id="settingsButton" title="Innstillinger">⚙</button>
<div id="settings">
  <strong>Innstillinger</strong>
  <label for="startTime">Starttid</label>
  <input id="startTime" type="time" value="10:30">
  <label for="interval">Minutter mellom fargene</label>
  <select id="interval">
    <option value="30" selected>30 minutter</option>
  </select>
  <button id="applySettings">Lagre innstillinger</button>
</div>

<script>
const palette = [
  { name: "Pink", color: "#ff4fb8" },
  { name: "Red", color: "#ed3030" },
  { name: "Silver", color: "#c0c0c0" },
  { name: "Green", color: "#22b95c" },
  { name: "Orange", color: "#ff8c20" },
  { name: "Blue", color: "#1688ff" },
  { name: "Yellow", color: "#ffe333" },
  { name: "Purple", color: "#a64dff" },
  { name: "Black", color: "#222222" },
  { name: "White", color: "#ffffff" }
];

let startMinutes = 10 * 60 + 30;
const intervalMinutes = 30;

const app = document.getElementById("app");
const colorsEl = document.getElementById("colors");

function localMinutes(date) {
  return date.getHours() * 60 + date.getMinutes();
}
function timeText(totalMinutes) {
  const m = ((totalMinutes % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" +
         String(m % 60).padStart(2, "0");
}
function scheduleForToday(now) {
  const todayStart = new Date(now);
  todayStart.setHours(0, 0, 0, 0);
  const nowMin = localMinutes(now);
  const startIndex = Math.floor((nowMin - startMinutes) / intervalMinutes);
  const firstIndex = startIndex - 1;
  const entries = [];
  for (let i = firstIndex; i < firstIndex + 50; i++) {
    const absoluteMin = startMinutes + i * intervalMinutes;
    const date = new Date(todayStart);
    date.setMinutes(absoluteMin);
    entries.push({
      index: i,
      color: palette[((i % palette.length) + palette.length) % palette.length],
      date,
      minutes: absoluteMin
    });
  }
  return entries;
}
function render() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("no-NO", { hour12: false });
  document.getElementById("dayLabel").textContent =
    now.toLocaleDateString("no-NO", { weekday: "long", day: "numeric", month: "long" });

  const day = now.getDay();
  const minutes = localMinutes(now);
  const weekendImageTime = (day === 0 || day === 6) &&
    minutes >= 8 * 60 + 30 && minutes < 11 * 60;

  if (weekendImageTime) {
    app.style.backgroundImage = "linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.45)), url('Rush-helg.jpg')";
  } else if (day >= 1 && day <= 5) {
    app.style.backgroundImage = "linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.68)), url('Rush-ukedag.jpg')";
  } else {
    app.style.backgroundImage = "none";
  }

  const entries = scheduleForToday(now);
  const current = entries.filter(e => e.date <= now).pop();
  const upcoming = entries.filter(e => e.date > now).slice(0, 20);

  colorsEl.innerHTML = "";
  const display = current ? [current, ...upcoming] : upcoming.slice(0, 20);

  display.forEach(entry => {
    const diff = Math.floor((entry.date.getTime() - now.getTime()) / 1000);
    const isCurrent = entry.date <= now &&
      now.getTime() < entry.date.getTime() + intervalMinutes * 60000;
    const row = document.createElement("div");
    row.className = "swatch" + (isCurrent ? " active" : "");
    const name = document.createElement("div");
    name.className = "color-name";
    name.style.color = entry.color.color;
    name.textContent = entry.color.name;
    const time = document.createElement("div");
    time.className = "color-time";
    time.textContent = timeText(entry.minutes);
    const count = document.createElement("div");
    count.className = "countdown";

    if (isCurrent) {
      count.textContent = "FERDIG OM " + formatDuration(
        Math.max(0, Math.floor((entry.date.getTime() + intervalMinutes * 60000 - now.getTime()) / 1000))
      );
    } else if (diff > 0) {
      count.textContent = "Starter om " + formatDuration(diff);
    } else {
      count.textContent = "FERDIG";
      count.classList.add("finished");
    }
    row.append(name, time, count);
    colorsEl.appendChild(row);
  });
}
function formatDuration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return h + "t " + String(m).padStart(2, "0") + "m";
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

document.getElementById("settingsButton").addEventListener("click", () => {
  const settings = document.getElementById("settings");
  settings.style.display = settings.style.display === "block" ? "none" : "block";
});
document.getElementById("applySettings").addEventListener("click", () => {
  const val = document.getElementById("startTime").value || "10:30";
  const parts = val.split(":").map(Number);
  startMinutes = parts[0] * 60 + parts[1];
  document.getElementById("settings").style.display = "none";
  render();
});
render();
setInterval(render, 1000);
</script>
</body>
</html>
