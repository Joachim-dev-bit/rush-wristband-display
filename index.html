<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rush – stående skjermvisning – ekstra stor tekst</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#08090d;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
#screen{height:100vh;min-height:100vh;width:100%;padding:clamp(14px,1.8vh,30px) clamp(16px,2vw,36px);display:flex;flex-direction:column;gap:0;position:relative;isolation:isolate;overflow:hidden;background:#090b12 center/cover no-repeat}
#screen:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(4,6,12,.30),rgba(4,6,12,.18)),linear-gradient(0deg,rgba(4,6,12,.28),rgba(4,6,12,.12))}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;flex-shrink:0}
.logo{display:block;width:clamp(105px,13vw,180px);max-height:clamp(48px,7vh,86px);object-fit:contain}
.clockblock{text-align:right;min-width:0}
.clock{font-size:clamp(24px,3vw,42px);font-weight:750;line-height:1.05;letter-spacing:.015em;font-variant-numeric:tabular-nums;color:#e5e8f2;text-shadow:0 2px 8px rgba(4,8,20,.55)}
.date{font-size:clamp(13px,1.15vw,17px);color:#cbd3e3;margin-top:7px;text-shadow:0 2px 7px rgba(4,8,20,.55)}
.welcome{margin:clamp(10px,1.6vh,24px) 0 clamp(6px,1vh,14px);text-align:center;font-size:clamp(25px,3.3vw,48px);line-height:1.03;font-weight:800;letter-spacing:.015em;text-transform:uppercase;color:#e4e7f2;text-shadow:0 2px 10px rgba(5,9,22,.62)}
.subhead{text-align:center;font-size:clamp(13px,1.2vw,18px);font-weight:600;color:#cbd3e3;margin:0 0 clamp(8px,1.2vh,18px);text-shadow:0 2px 7px rgba(5,9,22,.6)}
.cards{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(6px,.7vh,12px);width:100%;margin:0 auto;max-width:1900px;flex:1;min-height:0}
.card{height:100%;min-height:0;padding:clamp(8px,1.4vw,24px);border-radius:15px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 28px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.20);overflow:hidden}
.name{font-size:clamp(32px,3.2vw,46px);font-weight:900;letter-spacing:.025em}
.status{font-size:clamp(22px,2.1vw,30px);font-weight:800;letter-spacing:.08em;margin-bottom:8px}
.remaining{font-size:clamp(48px,5vw,70px);font-weight:900;line-height:1.08;font-variant-numeric:tabular-nums;white-space:nowrap}
.detail{font-size:clamp(20px,2vw,27px);font-weight:700;margin-top:5px;opacity:.95}
.card.pink{background:#ed168f;color:#fff}
.card.red{background:#ed3030;color:#fff}
.card.green{background:#22b95c;color:#101010}
.card.done{background:rgba(32,33,39,.94);color:#fff;border:1px solid rgba(255,255,255,.38)}
.done .remaining{font-size:clamp(48px,5vw,70px)}
footer{margin-top:auto;padding-top:clamp(24px,4vh,46px);text-align:center;font-size:clamp(11px,1vw,14px);font-weight:800;letter-spacing:.16em;color:#cbd3e3;text-shadow:0 2px 7px rgba(5,9,22,.55)}
@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{height:100%;min-height:0;height:220px}.welcome{margin-top:38px}}
@media(max-width:480px){#screen{padding:15px}.logo{width:92px}.clock{font-size:24px}.date{font-size:11px}.welcome{font-size:25px;margin-top:30px}.subhead{margin-bottom:22px}.cards{gap:8px}.card{height:100%;min-height:0;height:170px;padding:12px;border-radius:10px}.name{font-size:17px}.status{font-size:10px;margin-bottom:9px}.remaining{font-size:20px}.detail{font-size:10px;margin-top:8px}footer{padding-top:24px}}

@media (orientation: portrait){
 #screen{height:100vh;min-height:100vh;padding:1vh 2.4vw;gap:0}
 header{gap:2vw}
 .logo{width:clamp(80px,18vw,190px);max-height:6vh}
 .clock{font-size:clamp(20px,4.2vw,46px)}
 .date{font-size:clamp(10px,1.5vw,17px);margin-top:2px}
 .welcome{font-size:clamp(20px,4vw,48px);margin:.8vh 0 .4vh}
 .subhead{font-size:clamp(11px,1.8vw,19px);margin-bottom:.6vh}
 .cards{flex:0 0 auto;height:58vh;min-height:0;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(4,minmax(0,1fr));gap:.7vh;width:100%;max-width:100%;}
 .card{height:auto;min-height:0;padding:1vh 3vw;border-radius:10px;justify-content:space-evenly;gap:.3vh}
 .name{font-size:clamp(76px,10.4vw,120px);line-height:1.0}
 .status{font-size:clamp(52px,6.4vw,76px);line-height:1.0;margin-bottom:0;letter-spacing:.04em}
 .remaining{font-size:clamp(116px,16vw,176px);line-height:1.0}
 .detail{font-size:clamp(48px,6vw,68px);line-height:1.0;margin-top:3px}
 footer{padding-top:1vh;font-size:clamp(11px,1.5vw,18px)}
}
@media(max-height:700px){#screen{padding-top:8px;padding-bottom:8px}.welcome{margin-top:6px}.subhead{margin-bottom:6px}.cards{gap:5px}.card{padding-top:5px;padding-bottom:5px}footer{padding-top:4px}}

/* TV-LESBARHET: siste regler overstyrer små mobilregler i Samsung-nettleseren */
@media (max-width: 900px), (max-aspect-ratio: 3/4), (orientation: portrait) {
  .cards { gap: 8px !important; }
  .card { padding: 12px 18px !important; justify-content: space-around !important; }
  .name { font-size: 34px !important; line-height: 1.05 !important; }
  .status { font-size: 27px !important; line-height: 1.05 !important; letter-spacing: .04em !important; margin-bottom: 2px !important; }
  .remaining { font-size: 54px !important; line-height: 1.05 !important; }
  .done .remaining { font-size: 54px !important; }
  .detail { font-size: 24px !important; line-height: 1.08 !important; margin-top: 4px !important; }
}

</style>
</head>

<script>
/* ES5-compatible script for older Samsung TV browsers */
var colors=[
 {name:"PINK",hex:"#ed168f",text:"#fff"},
 {name:"RØD",hex:"#ed3030",text:"#fff"},
 {name:"SØLV",hex:"#c0c0c0",text:"#191919"},
 {name:"GRØNN",hex:"#22b95c",text:"#101010"},
 {name:"ORANSJE",hex:"#ff8c20",text:"#191919"},
 {name:"BLÅ",hex:"#1688ff",text:"#fff"},
 {name:"GUL",hex:"#ffe333",text:"#191919"},
 {name:"LILLA",hex:"#a64dff",text:"#fff"},
 {name:"SVART",hex:"#242424",text:"#fff"},
 {name:"HVIT",hex:"#f1f1f1",text:"#191919"}
];
var firstFinish=630, step=30;
var screen=document.getElementById("screen");
function pad2(n){return n<10?"0"+n:String(n);}
function parts(now){
 var d=new Date();
 return {hour:pad2(d.getHours()),minute:pad2(d.getMinutes()),second:pad2(d.getSeconds())};
}
function weekday(now){
 return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][now.getDay()];
}
function mins(p){return Number(p.hour)*60+Number(p.minute);}
function fmt(s){
 s=Math.max(0,Math.floor(s));
 var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
 return h ? h+"t "+pad2(m)+"m" : pad2(m)+":"+pad2(sec);
}
function render(){
 var now=new Date(),p=parts(now),minute=mins(p),wd=weekday(now);
 document.getElementById("clock").textContent=p.hour+":"+p.minute+":"+p.second;
 var days=["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
 var months=["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
 document.getElementById("date").textContent=days[now.getDay()]+" "+now.getDate()+". "+months[now.getMonth()];
 // Vanlig Rush-bakgrunn på denne testversjonen. Minisprett-bakgrunnen legges inn i den automatiske helgevisningen senere.
 screen.style.backgroundImage="url('https://joachim-dev-bit.github.io/rush-wristband-display/Rush-ukedag.jpg')";
 var k=Math.floor((minute-firstFinish)/step);
 var upcoming=[],lastIndex=null,recentlyFinished=false;
 if(minute<firstFinish){
   for(var i=0;i<4;i++){
     var finish=firstFinish+i*step;
     upcoming.push({i:i,finish:finish,seconds:(finish-minute)*60-Number(p.second)});
   }
 } else {
   var elapsedSinceFinish=(minute-firstFinish)-k*step;
   var completedAgeSeconds=elapsedSinceFinish*60+Number(p.second);
   recentlyFinished=completedAgeSeconds<120;
   lastIndex=((k%colors.length)+colors.length)%colors.length;
   var count=recentlyFinished?3:4;
   for(var j=k+1;j<k+1+count;j++){
     var f=firstFinish+j*step;
     upcoming.push({i:j,finish:f,seconds:(f-minute)*60-Number(p.second)});
   }
 }
 var cards=document.getElementById("cards");
 cards.innerHTML="";
 if(recentlyFinished && lastIndex!==null){
   var d=colors[lastIndex],done=document.createElement("article");
   done.className="card done";
   done.innerHTML='<div class="name">'+d.name+'</div><div><div class="status">STATUS</div><div class="remaining">FERDIG</div><div class="detail">Ferdigtid passert</div></div>';
   cards.appendChild(done);
 }
 for(var n=0;n<upcoming.length;n++){
   var it=upcoming[n],c=colors[((it.i%colors.length)+colors.length)%colors.length];
   var ftime=(it.finish%1440+1440)%1440;
   var t=pad2(Math.floor(ftime/60))+":"+pad2(ftime%60);
   var el=document.createElement("article");
   el.className="card";
   el.style.backgroundColor=c.hex;
   el.style.color=c.text;
   el.innerHTML='<div class="name">'+c.name+'</div><div><div class="status">FERDIG OM</div><div class="remaining">'+fmt(it.seconds)+'</div><div class="detail">Ferdig kl. '+t+'</div></div>';
   cards.appendChild(el);
 }
}
render();
setInterval(render,1000);
</script>
