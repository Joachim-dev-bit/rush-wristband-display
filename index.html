<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rush Wristband Display</title>
<style>
:root{color-scheme:dark;--rush:#0877e8;--bg:#050505;--panel:#17191e;--ink:#fff;--muted:#d5d9e0;--line:rgba(255,255,255,.17)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff}
#app{height:100vh;min-height:100vh;width:100%;overflow:hidden;background:var(--bg);color:var(--ink);padding:clamp(10px,1.5vw,22px);display:flex;flex-direction:column;gap:clamp(7px,1vh,12px)}
header{display:flex;justify-content:space-between;align-items:center;gap:18px}
.brand{font-weight:900;letter-spacing:.25em;font-size:clamp(16px,2vw,28px)}
.pill{border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--muted);font-size:clamp(11px,1.1vw,15px);font-weight:700;letter-spacing:.1em}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,.8vh,10px);width:100%;max-width:1800px;margin:0 auto}
.heading{text-align:center}.eyebrow{font-size:clamp(9px,.9vw,13px);font-weight:700;letter-spacing:.28em;color:var(--muted);margin-bottom:4px}.heading h1{font-size:clamp(22px,2.5vw,38px);line-height:1;margin:0;font-weight:900;letter-spacing:-.035em}
.time-panel{align-self:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 22px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.time-label{display:inline;font-size:clamp(9px,.8vw,11px);font-weight:700;letter-spacing:.15em;color:var(--muted);margin-right:10px}.time{display:inline;font-size:clamp(16px,1.6vw,23px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.035em}
.section-label{font-size:clamp(9px,.9vw,12px);font-weight:800;letter-spacing:.2em;color:var(--muted);margin:0 0 5px 2px}
main>section:last-child{flex:1;min-height:0;display:flex;flex-direction:column}
.colors{display:flex;flex:1;min-height:0;flex-direction:column;gap:clamp(2px,.3vh,4px)}
.swatch{flex:1;min-height:0;border-radius:clamp(5px,.5vw,9px);display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(12px,2vw,28px);border:1px solid rgba(255,255,255,.18);box-shadow:0 3px 10px rgba(0,0,0,.25);font-weight:900;overflow:hidden;text-align:left}
.swatch .name{font-size:clamp(12px,1.4vw,20px);letter-spacing:.07em;text-shadow:0 1px 3px rgba(0,0,0,.15)}
.swatch .number{font-size:clamp(12px,1.5vw,21px);opacity:.98;letter-spacing:.04em;font-variant-numeric:tabular-nums}
footer{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:clamp(10px,1vw,14px);font-weight:700;letter-spacing:.08em}
.controls{position:fixed;right:16px;bottom:16px;z-index:5;background:#fff;color:#10243b;border:1px solid #d5deea;border-radius:16px;padding:14px;box-shadow:0 12px 36px rgba(0,0,0,.25);width:min(330px,calc(100vw - 32px));display:none;max-height:80vh;overflow:auto}
.controls.open{display:block}.controls h2{font-size:16px;margin:0 0 12px}.controls label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}.controls input,.controls textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#10243b;font:inherit}.controls textarea{min-height:70px;resize:vertical}.controls button{border:0;border-radius:8px;background:#0877e8;color:#fff;font-weight:800;padding:10px 12px;margin-top:12px;cursor:pointer;width:100%}.controls .secondary{background:#e7eef7;color:#17324f}.gear{position:fixed;right:14px;top:14px;z-index:6;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 13px;font-size:18px;cursor:pointer;opacity:.75}.gear:hover{opacity:1}
@media(max-width:760px){#app{padding:10px;gap:7px}.brand{letter-spacing:.12em}.pill{padding:6px 9px}.swatch .name,.swatch .number{font-size:clamp(11px,2.5vw,16px)}}
@media(max-height:600px){#app{padding:8px;gap:5px}main{gap:5px}.heading h1{font-size:22px}.time-panel{padding:3px 14px}.swatch .name,.swatch .number{font-size:12px}footer{font-size:9px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">RUSH <span style="font-weight:500;letter-spacing:.16em">HAUGESUND</span></div><div class="pill">WRISTBAND DISPLAY</div></header>
<main>
<section class="heading"><div class="eyebrow">VELKOMMEN TIL PARKEN</div><h1>DAGENS ARMBÅND</h1></section>
<section class="time-panel"><div class="time-label">ÅPNINGSTID</div><div class="time" id="hours">09:00 – 20:00</div></section>
<section><div class="section-label">FARGEREKKEFØLGE</div><div class="colors" id="colors"></div></section>
</main>
<footer><span>HOPP HØYT. HA DET GØY.</span><span id="date"></span></footer>
<button class="gear" id="gear" aria-label="Åpne innstillinger" title="Innstillinger">⚙</button>
<aside class="controls" id="controls"><h2>Tilpass displayet</h2><label for="bg">Bakgrunnsfarge (HEX)</label><input id="bg" value="#050505" maxlength="7"><label for="start">Starttid</label><input id="start" value="09:00:00" type="time" step="1"><label for="end">Sluttid</label><input id="end" value="20:00:00" type="time" step="1"><label for="sequence">Fargerekkefølge (kommaseparert)</label><textarea id="sequence">Gold,gold,pink,red,grey,green,orange,blue,yellow,purple,black,white,pink,red,grey,green,orange,blue,yellow,purple,black,white</textarea><button id="apply">Oppdater display</button><button class="secondary" id="share">Kopier lenke med innstillingene</button><button class="secondary" id="hide">Skjul innstillinger</button></aside>
</div>
<script>
const palette={gold:{hex:'#D4AF37',text:'#171717',label:'GULL'},pink:{hex:'#FF69B4',text:'#27101d',label:'ROSA'},red:{hex:'#F04444',text:'#fff',label:'RØD'},grey:{hex:'#A8B0BB',text:'#111827',label:'GRÅ'},gray:{hex:'#A8B0BB',text:'#111827',label:'GRÅ'},green:{hex:'#35C759',text:'#102317',label:'GRØNN'},orange:{hex:'#FF8C24',text:'#281707',label:'ORANSJE'},blue:{hex:'#1685FF',text:'#fff',label:'BLÅ'},yellow:{hex:'#FFE34D',text:'#28220a',label:'GUL'},purple:{hex:'#A66CFF',text:'#fff',label:'LILLA'},black:{hex:'#17191E',text:'#fff',label:'SVART'},white:{hex:'#F7F9FC',text:'#152238',label:'HVIT'}};
const params=new URLSearchParams(location.search);
const getParam=(k,f)=>params.get(k)||f;
const initialSequence=getParam('sequence','Gold,gold,pink,red,grey,green,orange,blue,yellow,purple,black,white,pink,red,grey,green,orange,blue,yellow,purple,black,white');
const $=id=>document.getElementById(id);
function normalizeTime(v){return (v||'09:00:00').length===5?v+':00':v}
function render(){const bg=$('bg').value.trim();if(/^#[0-9a-fA-F]{6}$/.test(bg)){document.documentElement.style.setProperty('--bg',bg);document.body.style.background=bg;$('app').style.background=bg;}
const start=normalizeTime($('start').value),end=normalizeTime($('end').value);$('hours').textContent=start.slice(0,5)+' – '+end.slice(0,5);
const names=$('sequence').value.split(',').map(s=>s.trim()).filter(Boolean);const root=$('colors');root.innerHTML='';const toMinutes=t=>{const parts=t.split(':').map(Number);return parts[0]*60+(parts[1]||0)};const fromMinutes=m=>{const v=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')};const startM=toMinutes(start),endM=toMinutes(end)+(toMinutes(end)<=startM?1440:0),step=names.length?(endM-startM)/names.length:0;names.forEach((name,i)=>{const key=name.toLowerCase();const c=palette[key]||{hex:'#0877e8',text:'#fff',label:name.toUpperCase()};const el=document.createElement('div');el.className='swatch';el.style.background=c.hex;el.style.color=c.text;el.innerHTML='<span class="number"></span><span class="name"></span>';el.querySelector('.number').textContent=fromMinutes(startM+i*step);el.querySelector('.name').textContent=c.label;el.title='Armbånd '+(i+1)+': '+fromMinutes(startM+i*step);root.appendChild(el)});
$('date').textContent=new Intl.DateTimeFormat('no-NO',{weekday:'long',day:'numeric',month:'long'}).format(new Date()).toUpperCase();}
$('bg').value=getParam('bg','#050505');$('start').value=normalizeTime(getParam('startTime','09:00:00'));$('end').value=normalizeTime(getParam('endTime','20:00:00'));$('sequence').value=initialSequence;
$('gear').addEventListener('click',()=>$('controls').classList.toggle('open'));$('hide').addEventListener('click',()=>$('controls').classList.remove('open'));$('apply').addEventListener('click',()=>{render();const p=new URLSearchParams();p.set('bg',$('bg').value);p.set('startTime',normalizeTime($('start').value));p.set('endTime',normalizeTime($('end').value));p.set('sequence',$('sequence').value.split(',').map(s=>s.trim()).filter(Boolean).join(','));history.replaceState(null,'',location.pathname+'?'+p.toString())});$('share').addEventListener('click',async()=>{const p=new URLSearchParams();p.set('bg',$('bg').value);p.set('startTime',normalizeTime($('start').value));p.set('endTime',normalizeTime($('end').value));p.set('sequence',$('sequence').value.split(',').map(s=>s.trim()).filter(Boolean).join(','));const link=location.origin+location.pathname+'?'+p.toString();try{await navigator.clipboard.writeText(link);$('share').textContent='Lenke kopiert!'}catch(e){prompt('Kopier denne lenken:',link)}});render();
</script>
</body>
</html>
